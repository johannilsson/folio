<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Folio</title>
  <script>
    (function () {
      const saved = localStorage.getItem('folio-theme')
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved
    })()
  </script>
  <style>
    /* ── Theme variables ── */

    :root {
      --bg: #1a1a1a;
      --bg-raised: #222;
      --bg-surface: #2a2a3a;
      --bg-input: #151525;
      --border: #333;
      --border-mid: #444;
      --border-muted: #555;
      --text: #e0e0e0;
      --text-strong: #f0f0f0;
      --text-2: #aaa;
      --text-3: #888;
      --text-4: #666;
      --text-link: #7dd3fc;
      --text-raw: #cdd6f4;
      --card-bg: #1a1a1a;
      --card-author: #d0d0e0;
      --card-body: #b8b8d0;
      --card-focused: rgba(255,255,255,.4);
      --chip-bg: #3a3a50;
      --chip-bg-h: #44445e;
      --chip: #aaa;
      --chip-h: #ccc;
      --float-bg: #1a1a1a;
      --float-shadow: 0 4px 20px rgba(0,0,0,.75), 0 1px 4px rgba(0,0,0,.5);
      --af-text: #e0e0e0;
      --af-hover: rgba(255,255,255,.1);
      --af-div: #333;
      --cancel-bg-h: #2a2a3a;
      --toolbar-btn-hover: rgba(255,255,255,.07);
      --toolbar-btn-hover-text: #aaa;
      --ann-del-bg: rgba(239,68,68,.22);
      --ann-del-text: #fca5a5;
      --ann-del-bdr: rgba(239,68,68,.55);
      --ann-ins-bg: rgba(34,197,94,.2);
      --ann-ins-text: #86efac;
      --ann-ins-bdr: rgba(34,197,94,.55);
      --ann-hi: rgb(247,253,73);
      --ann-com-bg: rgba(250,204,21,.28);
      --ann-com-bdr: rgba(250,204,21,.9);
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #fafaf8;
        --bg-raised: #f0f0ee;
        --bg-surface: #ebebf0;
        --bg-input: #f0f0f5;
        --border: #d8d8d5;
        --border-mid: #ddd;
        --border-muted: #bbb;
        --text: #1a1a1a;
        --text-strong: #0f0f0f;
        --text-2: #666;
        --text-3: #777;
        --text-4: #999;
        --text-link: #2563eb;
        --text-raw: #1e1e3a;
        --card-bg: #ffffff;
        --card-author: #2a2a3a;
        --card-body: #444460;
        --card-focused: rgba(0,0,0,.3);
        --chip-bg: #e8e8f0;
        --chip-bg-h: #d8d8e8;
        --chip: #666;
        --chip-h: #444;
        --float-bg: #ffffff;
        --float-shadow: 0 4px 20px rgba(0,0,0,.15), 0 1px 4px rgba(0,0,0,.08);
        --af-text: #1a1a1a;
        --af-hover: rgba(0,0,0,.07);
        --af-div: #ddd;
        --cancel-bg-h: #ebebf0;
        --toolbar-btn-hover: rgba(0,0,0,.06);
        --toolbar-btn-hover-text: #555;
        --ann-del-bg: rgba(239,68,68,.12);
        --ann-del-text: #dc2626;
        --ann-del-bdr: rgba(239,68,68,.5);
        --ann-ins-bg: rgba(34,197,94,.12);
        --ann-ins-text: #15803d;
        --ann-ins-bdr: rgba(34,197,94,.5);
        --ann-hi: rgb(202,138,4);
        --ann-com-bg: rgba(250,204,21,.18);
        --ann-com-bdr: rgba(250,204,21,.7);
      }
    }

    html[data-theme="light"] {
      --bg: #fafaf8;
      --bg-raised: #f0f0ee;
      --bg-surface: #ebebf0;
      --bg-input: #f0f0f5;
      --border: #d8d8d5;
      --border-mid: #ddd;
      --border-muted: #bbb;
      --text: #1a1a1a;
      --text-strong: #0f0f0f;
      --text-2: #666;
      --text-3: #777;
      --text-4: #999;
      --text-link: #2563eb;
      --text-raw: #1e1e3a;
      --card-bg: #ffffff;
      --card-author: #2a2a3a;
      --card-body: #444460;
      --card-focused: rgba(0,0,0,.3);
      --chip-bg: #e8e8f0;
      --chip-bg-h: #d8d8e8;
      --chip: #666;
      --chip-h: #444;
      --float-bg: #ffffff;
      --float-shadow: 0 4px 20px rgba(0,0,0,.15), 0 1px 4px rgba(0,0,0,.08);
      --af-text: #1a1a1a;
      --af-hover: rgba(0,0,0,.07);
      --af-div: #ddd;
      --cancel-bg-h: #ebebf0;
      --toolbar-btn-hover: rgba(0,0,0,.06);
      --toolbar-btn-hover-text: #555;
      --ann-del-bg: rgba(239,68,68,.12);
      --ann-del-text: #dc2626;
      --ann-del-bdr: rgba(239,68,68,.5);
      --ann-ins-bg: rgba(34,197,94,.12);
      --ann-ins-text: #15803d;
      --ann-ins-bdr: rgba(34,197,94,.5);
      --ann-hi: rgb(202,138,4);
      --ann-com-bg: rgba(250,204,21,.18);
      --ann-com-bdr: rgba(250,204,21,.7);
    }

    html[data-theme="dark"] {
      --bg: #1a1a1a;
      --bg-raised: #222;
      --bg-surface: #2a2a3a;
      --bg-input: #151525;
      --border: #333;
      --border-mid: #444;
      --border-muted: #555;
      --text: #e0e0e0;
      --text-strong: #f0f0f0;
      --text-2: #aaa;
      --text-3: #888;
      --text-4: #666;
      --text-link: #7dd3fc;
      --text-raw: #cdd6f4;
      --card-bg: #1a1a1a;
      --card-author: #d0d0e0;
      --card-body: #b8b8d0;
      --card-focused: rgba(255,255,255,.4);
      --chip-bg: #3a3a50;
      --chip-bg-h: #44445e;
      --chip: #aaa;
      --chip-h: #ccc;
      --float-bg: #1a1a1a;
      --float-shadow: 0 4px 20px rgba(0,0,0,.75), 0 1px 4px rgba(0,0,0,.5);
      --af-text: #e0e0e0;
      --af-hover: rgba(255,255,255,.1);
      --af-div: #333;
      --cancel-bg-h: #2a2a3a;
      --toolbar-btn-hover: rgba(255,255,255,.07);
      --toolbar-btn-hover-text: #aaa;
      --ann-del-bg: rgba(239,68,68,.22);
      --ann-del-text: #fca5a5;
      --ann-del-bdr: rgba(239,68,68,.55);
      --ann-ins-bg: rgba(34,197,94,.2);
      --ann-ins-text: #86efac;
      --ann-ins-bdr: rgba(34,197,94,.55);
      --ann-hi: rgb(247,253,73);
      --ann-com-bg: rgba(250,204,21,.28);
      --ann-com-bdr: rgba(250,204,21,.9);
    }

    /* ── Base ── */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    #app {
      display: flex;
      height: 100vh;
    }

    /* ── Editor pane ── */

    #editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #editor-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: var(--bg-raised);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #filename-display {
      flex: 1;
      text-align: center;
      font-size: 13px;
      color: var(--text-3);
      font-family: 'SF Mono', 'Fira Code', monospace;
      pointer-events: none;
    }

    #toggle-raw, #toggle-theme {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: var(--text-4);
      cursor: pointer;
      font-family: inherit;
    }
    #toggle-raw:hover, #toggle-theme:hover {
      background: var(--toolbar-btn-hover);
      color: var(--toolbar-btn-hover-text);
    }

    /* ── WYSIWYG area: editor + gutter side by side, scrolling together ── */

    #editor-wrapper {
      flex: 1;
      display: flex;
      align-items: flex-start;
      overflow-y: auto;
      position: relative;
    }
    #editor-wrapper[hidden] { display: none; }

    /* Tiptap renders the content editable inside the element we pass it */
    #editor-tiptap {
      flex: 1;
      min-width: 0;
    }

    #editor-tiptap .tiptap {
      padding: 2rem;
      min-height: 100%;
      outline: none;
      font-size: 15px;
      line-height: 1.75;
      color: var(--text);
    }

    /* ── Tiptap content styles ── */

    .tiptap h1, .tiptap h2, .tiptap h3,
    .tiptap h4, .tiptap h5, .tiptap h6 {
      margin: 1.4em 0 0.4em;
      color: var(--text-strong);
      line-height: 1.3;
    }
    .tiptap h1 { font-size: 1.9em; }
    .tiptap h2 { font-size: 1.5em; }
    .tiptap h3 { font-size: 1.2em; }

    .tiptap p { margin: 0.6em 0; }

    .tiptap strong { color: var(--text-strong); }

    .tiptap code {
      background: var(--bg-surface);
      padding: 0.1em 0.35em;
      border-radius: 3px;
      font-size: 0.875em;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .tiptap pre {
      background: var(--bg-surface);
      padding: 1em;
      border-radius: 6px;
      overflow-x: auto;
      margin: 1em 0;
    }
    .tiptap pre code { background: none; padding: 0; }

    /* Syntax highlighting — light theme */
    .tiptap pre .hljs-keyword,
    .tiptap pre .hljs-operator,
    .tiptap pre .hljs-selector-tag { color: #cf222e; }
    .tiptap pre .hljs-string,
    .tiptap pre .hljs-regexp { color: #0a3069; }
    .tiptap pre .hljs-number,
    .tiptap pre .hljs-literal { color: #0550ae; }
    .tiptap pre .hljs-built_in,
    .tiptap pre .hljs-type { color: #0550ae; }
    .tiptap pre .hljs-title,
    .tiptap pre .hljs-title.function_,
    .tiptap pre .hljs-title.class_ { color: #8250df; }
    .tiptap pre .hljs-variable,
    .tiptap pre .hljs-template-variable { color: #953800; }
    .tiptap pre .hljs-attr,
    .tiptap pre .hljs-attribute,
    .tiptap pre .hljs-property { color: #0550ae; }
    .tiptap pre .hljs-tag,
    .tiptap pre .hljs-name { color: #116329; }
    .tiptap pre .hljs-comment,
    .tiptap pre .hljs-doctag { color: #6e7781; font-style: italic; }
    .tiptap pre .hljs-meta { color: #6e7781; }
    .tiptap pre .hljs-addition { background: rgba(34,197,94,.12); color: #15803d; }
    .tiptap pre .hljs-deletion { background: rgba(239,68,68,.12); color: #dc2626; }

    /* Syntax highlighting — dark theme */
    html[data-theme="dark"] .tiptap pre .hljs-keyword,
    html[data-theme="dark"] .tiptap pre .hljs-operator,
    html[data-theme="dark"] .tiptap pre .hljs-selector-tag { color: #ff7b72; }
    html[data-theme="dark"] .tiptap pre .hljs-string,
    html[data-theme="dark"] .tiptap pre .hljs-regexp { color: #a5d6ff; }
    html[data-theme="dark"] .tiptap pre .hljs-number,
    html[data-theme="dark"] .tiptap pre .hljs-literal { color: #79c0ff; }
    html[data-theme="dark"] .tiptap pre .hljs-built_in,
    html[data-theme="dark"] .tiptap pre .hljs-type { color: #79c0ff; }
    html[data-theme="dark"] .tiptap pre .hljs-title,
    html[data-theme="dark"] .tiptap pre .hljs-title.function_,
    html[data-theme="dark"] .tiptap pre .hljs-title.class_ { color: #d2a8ff; }
    html[data-theme="dark"] .tiptap pre .hljs-variable,
    html[data-theme="dark"] .tiptap pre .hljs-template-variable { color: #ffa657; }
    html[data-theme="dark"] .tiptap pre .hljs-attr,
    html[data-theme="dark"] .tiptap pre .hljs-attribute,
    html[data-theme="dark"] .tiptap pre .hljs-property { color: #79c0ff; }
    html[data-theme="dark"] .tiptap pre .hljs-tag,
    html[data-theme="dark"] .tiptap pre .hljs-name { color: #7ee787; }
    html[data-theme="dark"] .tiptap pre .hljs-comment,
    html[data-theme="dark"] .tiptap pre .hljs-doctag { color: #8b949e; font-style: italic; }
    html[data-theme="dark"] .tiptap pre .hljs-meta { color: #8b949e; }
    html[data-theme="dark"] .tiptap pre .hljs-addition { background: rgba(34,197,94,.15); color: #56d364; }
    html[data-theme="dark"] .tiptap pre .hljs-deletion { background: rgba(239,68,68,.15); color: #ff7b72; }

    /* Dark auto (prefers-color-scheme) */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .tiptap pre .hljs-keyword,
      :root:not([data-theme="light"]) .tiptap pre .hljs-operator,
      :root:not([data-theme="light"]) .tiptap pre .hljs-selector-tag { color: #ff7b72; }
      :root:not([data-theme="light"]) .tiptap pre .hljs-string,
      :root:not([data-theme="light"]) .tiptap pre .hljs-regexp { color: #a5d6ff; }
      :root:not([data-theme="light"]) .tiptap pre .hljs-number,
      :root:not([data-theme="light"]) .tiptap pre .hljs-literal { color: #79c0ff; }
      :root:not([data-theme="light"]) .tiptap pre .hljs-built_in,
      :root:not([data-theme="light"]) .tiptap pre .hljs-type { color: #79c0ff; }
      :root:not([data-theme="light"]) .tiptap pre .hljs-title,
      :root:not([data-theme="light"]) .tiptap pre .hljs-title.function_,
      :root:not([data-theme="light"]) .tiptap pre .hljs-title.class_ { color: #d2a8ff; }
      :root:not([data-theme="light"]) .tiptap pre .hljs-variable,
      :root:not([data-theme="light"]) .tiptap pre .hljs-template-variable { color: #ffa657; }
      :root:not([data-theme="light"]) .tiptap pre .hljs-attr,
      :root:not([data-theme="light"]) .tiptap pre .hljs-attribute,
      :root:not([data-theme="light"]) .tiptap pre .hljs-property { color: #79c0ff; }
      :root:not([data-theme="light"]) .tiptap pre .hljs-tag,
      :root:not([data-theme="light"]) .tiptap pre .hljs-name { color: #7ee787; }
      :root:not([data-theme="light"]) .tiptap pre .hljs-comment,
      :root:not([data-theme="light"]) .tiptap pre .hljs-doctag { color: #8b949e; font-style: italic; }
      :root:not([data-theme="light"]) .tiptap pre .hljs-meta { color: #8b949e; }
      :root:not([data-theme="light"]) .tiptap pre .hljs-addition { background: rgba(34,197,94,.15); color: #56d364; }
      :root:not([data-theme="light"]) .tiptap pre .hljs-deletion { background: rgba(239,68,68,.15); color: #ff7b72; }
    }

    .tiptap blockquote {
      border-left: 3px solid var(--border-muted);
      padding-left: 1em;
      color: var(--text-2);
      margin: 1em 0;
    }

    .tiptap a { color: var(--text-link); }

    .tiptap ul, .tiptap ol { padding-left: 1.5em; margin: 0.5em 0; }

    .tiptap li { margin: 0.2em 0; }

    .tiptap hr {
      border: none;
      border-top: 1px solid var(--border-mid);
      margin: 1.5em 0;
    }

    .tiptap table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
    }
    .tiptap th, .tiptap td {
      border: 1px solid var(--border-mid);
      padding: 0.4em 0.7em;
    }
    .tiptap th { background: var(--bg-surface); }

    /* ── Raw markdown pane ── */

    #raw-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #raw-pane[hidden] { display: none; }

    #raw-pane textarea {
      flex: 1;
      padding: 2rem;
      background: var(--bg);
      color: var(--text-raw);
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 13px;
      line-height: 1.6;
      border: none;
      outline: none;
      resize: none;
    }

    /* ── Annotation decorations (inline) ── */

    .ann-delete {
      background: var(--ann-del-bg);
      text-decoration: line-through;
      text-decoration-color: var(--ann-del-bdr);
      color: var(--ann-del-text);
      border-bottom: 2px solid var(--ann-del-bdr);
      padding: 1px 3px;
      border-radius: 3px;
    }

    .ann-insert-preview {
      background: var(--ann-ins-bg);
      color: var(--ann-ins-text);
      border-bottom: 2px solid var(--ann-ins-bdr);
      padding: 1px 3px;
      border-radius: 3px;
    }

    .ann-highlight {
      text-decoration: underline dotted var(--ann-hi);
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
      padding: 1px 3px;
      border-radius: 3px;
    }

    .ann-comment-target {
      background: var(--ann-com-bg);
      border-bottom: 2px solid var(--ann-com-bdr);
      padding: 1px 3px;
      border-radius: 3px;
    }

    .ann-comment-pending {
      background: var(--ann-com-bg);
      border-bottom: 2px dashed var(--ann-com-bdr);
      padding: 1px 3px;
      border-radius: 3px;
    }

    /* ── Annotation gutter (scrolls with document) ── */

    #annotation-gutter {
      width: 280px;
      flex-shrink: 0;
      position: relative;
      pointer-events: none;
    }

    /* ── Gutter cards ── */

    .ann-card {
      position: absolute;
      left: 8px;
      right: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px 10px;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ann-card[data-source="agent"]  { border-left: 3px solid #22d3ee; }
    .ann-card[data-source="local"]  { border-left: 3px solid #6366f1; }
    .ann-card[data-source="github"],
    .ann-card[data-source="gitlab"] { border-left: 3px solid #f472b6; }

    .ann-card-actions {
      display: none;
      gap: 5px;
    }
    .ann-card-focused .ann-card-actions { display: flex; }

    .ann-card-btn {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .ann-card { cursor: pointer; }

    .ann-card-dismiss {
      background: var(--chip-bg);
      color: var(--chip);
    }
    .ann-card-dismiss:hover { background: var(--chip-bg-h); color: var(--chip-h); }

    .ann-card-header {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .ann-card-author {
      font-size: 12px;
      font-weight: 600;
      color: var(--card-author);
    }
    .ann-card-time {
      font-size: 10px;
      color: var(--text-3);
    }

    .ann-card-body {
      font-size: 12px;
      color: var(--card-body);
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
    }

    /* ── Overlays (action + comment pill) ── */

    #action-floater, #comment-floater {
      position: absolute;
      z-index: 20;
      display: flex;
      align-items: center;
      padding: 3px 4px;
      background: var(--float-bg);
      border-radius: 999px;
      box-shadow: var(--float-shadow);
      transform: translateX(-50%) translateY(calc(-100% - 8px));
      white-space: nowrap;
    }
    #action-floater[hidden] { display: none; }
    #comment-floater[hidden] { display: none; }

    .af-btn {
      font-size: 13px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 999px;
      border: none;
      background: transparent;
      cursor: pointer;
      white-space: nowrap;
      letter-spacing: 0.01em;
    }
    .af-btn { color: var(--af-text); }
    .af-btn:hover { background: var(--af-hover); }

    .af-divider {
      width: 1px;
      height: 16px;
      background: var(--af-div);
      flex-shrink: 0;
    }

    /* ── Floating comment adder ── */

    .cf-gutter-form {
      position: absolute;
      left: 8px;
      right: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-left: 3px solid #6366f1;
      border-radius: 7px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: auto;
    }
    .cf-gutter-form[hidden] { display: none; }

    .cf-textarea {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      line-height: 1.5;
      padding: 6px 8px;
      resize: none;
      outline: none;
      width: 100%;
    }
    .cf-textarea:focus { border-color: rgba(99, 102, 241, 0.5); }

    .cf-actions { display: flex; gap: 5px; justify-content: flex-end; }

    .cf-submit {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      background: #4f46e5;
      color: #fff;
      font-family: inherit;
    }
    .cf-submit:hover { background: #4338ca; }

    .cf-cancel {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-3);
      cursor: pointer;
      font-family: inherit;
    }
    .cf-cancel:hover { background: var(--cancel-bg-h); }

    .ann-card-focused {
      border-color: var(--card-focused);
    }

    /* ── Table UI ── */

    /* Column handle — thin tab above hovered column */
    #table-col-handle {
      position: absolute;
      z-index: 20;
      height: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-mid);
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      color: var(--text-4);
      font-size: 9px;
      letter-spacing: 3px;
    }
    #table-col-handle[hidden] { display: none; }
    #table-col-handle::after { content: '•••'; }
    #table-col-handle:hover {
      background: var(--bg-raised);
      border-color: var(--border-muted);
      color: var(--text-2);
    }

    /* Row handle — thin tab left of hovered row */
    #table-row-handle {
      position: absolute;
      z-index: 20;
      width: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-mid);
      border-right: none;
      border-radius: 4px 0 0 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      color: var(--text-4);
      font-size: 9px;
      writing-mode: vertical-lr;
      letter-spacing: 3px;
    }
    #table-row-handle[hidden] { display: none; }
    #table-row-handle::after { content: '•••'; }
    #table-row-handle:hover {
      background: var(--bg-raised);
      border-color: var(--border-muted);
      color: var(--text-2);
    }

    /* Column / row dropdown menus */
    #table-col-menu,
    #table-row-menu {
      position: absolute;
      z-index: 30;
      background: var(--float-bg);
      border: 1px solid var(--border-mid);
      border-radius: 7px;
      box-shadow: var(--float-shadow);
      min-width: 170px;
      padding: 4px;
      display: flex;
      flex-direction: column;
    }
    #table-col-menu[hidden],
    #table-row-menu[hidden] { display: none; }

    #table-col-menu button,
    #table-row-menu button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 6px 10px;
      border: none;
      background: transparent;
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
      color: var(--af-text);
      cursor: pointer;
    }
    #table-col-menu button:hover,
    #table-row-menu button:hover { background: var(--af-hover); }
    #table-col-menu button:disabled,
    #table-row-menu button:disabled { opacity: 0.35; cursor: not-allowed; }
    #table-col-menu button:disabled:hover,
    #table-row-menu button:disabled:hover { background: transparent; }
    #table-col-menu button.tt-menu-danger,
    #table-row-menu button.tt-menu-danger { color: var(--ann-del-text); }
    #table-col-menu button.tt-menu-danger:hover,
    #table-row-menu button.tt-menu-danger:hover { background: var(--ann-del-bg); }

    .tt-menu-sep {
      height: 1px;
      background: var(--border);
      margin: 4px 2px;
      flex-shrink: 0;
    }

    /* Extend "+" buttons */
    #table-extend-row,
    #table-extend-col {
      position: absolute;
      z-index: 15;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid var(--border-mid);
      background: var(--bg-raised);
      color: var(--text-3);
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      pointer-events: auto;
    }
    #table-extend-row[hidden],
    #table-extend-col[hidden] { display: none; }
    #table-extend-row:hover,
    #table-extend-col:hover {
      background: var(--bg-surface);
      color: var(--text);
      border-color: var(--border-muted);
    }

    /* ── Diagram blocks ── */

    .tiptap .diagram-block {
      margin: 1em 0;
      text-align: center;
    }

    .tiptap .diagram-block svg {
      max-width: 100%;
      height: auto;
    }

    .tiptap .diagram-block img {
      max-width: 100%;
      height: auto;
    }

    .tiptap .diagram-loading {
      color: var(--text-4);
      font-style: italic;
      font-size: 13px;
      padding: 1em 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="editor-pane">
      <div id="editor-toolbar">
        <button id="toggle-raw" title="Switch to Markdown source">&lt;/&gt;</button>
        <span id="filename-display"></span>
        <button id="toggle-theme" title="Toggle light/dark mode">☀</button>
      </div>
      <div id="editor-wrapper">
        <div id="editor-tiptap"></div>
      </div>
      <div id="raw-pane" hidden>
        <textarea spellcheck="false" placeholder="Markdown source…"></textarea>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
