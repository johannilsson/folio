<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Folio</title>
  <style>
    /* ── Theme variables ── */

    :root {
      --bg: #1a1a1a;
      --accent: #a78bfa;
      --content-width: 720px;
      --accent-soft: rgba(124, 58, 237, 0.16);
      --bg-raised: #222;
      --bg-surface: #2a2a3a;
      --border: #333;
      --border-mid: #444;
      --border-muted: #555;
      --text: #e0e0e0;
      --text-strong: #f0f0f0;
      --text-2: #aaa;
      --text-3: #888;
      --text-4: #666;
      --text-link: #7dd3fc;
      --float-bg: #1a1a1a;
      --float-shadow: 0 4px 20px rgba(0,0,0,.75), 0 1px 4px rgba(0,0,0,.5);
      --af-text: #e0e0e0;
      --af-hover: rgba(255,255,255,.1);
      --ann-del-bg: rgba(239,68,68,.22);
      --ann-del-text: #fca5a5;
      --ann-del-bdr: rgba(239,68,68,.55);
      --ann-ins-bg: rgba(34,197,94,.2);
      --ann-ins-text: #86efac;
      --ann-ins-bdr: rgba(34,197,94,.55);
      --ann-hi: rgb(167,139,250);
      --ann-com-bg: rgba(167,139,250,.30);
      --cm-selection: rgba(167,139,250,.50);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --accent: #7c3aed;
        --accent-soft: rgba(124, 58, 237, 0.08);
        --bg-raised: #f0f0ee;
        --bg-surface: #ebebf0;
        --border: #d8d8d5;
        --border-mid: #ddd;
        --border-muted: #bbb;
        --text: #1a1a1a;
        --text-strong: #0f0f0f;
        --text-2: #666;
        --text-3: #777;
        --text-4: #999;
        --text-link: #2563eb;
        --float-bg: #ffffff;
        --float-shadow: 0 4px 20px rgba(0,0,0,.15), 0 1px 4px rgba(0,0,0,.08);
        --af-text: #1a1a1a;
        --af-hover: rgba(0,0,0,.07);
        --ann-del-bg: rgba(239,68,68,.12);
        --ann-del-text: #dc2626;
        --ann-del-bdr: rgba(239,68,68,.5);
        --ann-ins-bg: rgba(34,197,94,.12);
        --ann-ins-text: #15803d;
        --ann-ins-bdr: rgba(34,197,94,.5);
        --ann-hi: rgb(124,58,237);
        --ann-com-bg: rgba(124,58,237,.16);
        --cm-selection: rgba(124,58,237,.30);
      }
    }

    /* ── Base ── */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    #app {
      display: flex;
      height: 100vh;
    }

    /* ── Editor pane ── */

    #editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Floating controls: pills overlay the text, which flows edge to edge */
    #editor-pane { position: relative; }

    #editor-toolbar {
      position: absolute;
      top: 10px;
      left: 32px;
      right: 32px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      pointer-events: none;
    }
    #editor-toolbar > * { pointer-events: auto; }

    .float-pill {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 30px;
      padding: 0 12px;
      background: var(--bg-raised);
      border-radius: 15px;
      box-shadow: var(--float-shadow);
    }
    .float-pill { box-sizing: border-box; }

    #preview-readonly-notice {
      font-size: 12px;
      color: var(--text-3);
      cursor: help;
    }
    #preview-readonly-notice[hidden] { display: none; }

    /* ── Native app ──
       The macOS app adds class native-chrome to <html>. The window then supplies the
       title and the source/comments toolbar, so the floating pills go (the read-only
       notice stays) and the text can start higher. */
    html.native-chrome #title-pill:not(:has(#preview-readonly-notice:not([hidden]))) { display: none; }
    html.native-chrome #editor-tiptap .tiptap { padding-top: 1rem; }
    html.native-chrome #editor-tiptap .tiptap > :first-child { margin-top: 0; }
    html.native-chrome #frontmatter-box { margin-top: 1rem; }

    /* The window's scroll view scrolls the page, which lays itself out at its full height
       (src/layout.ts reports it). No box in the page scrolls; a short preview still fills
       the window, so a click below the text lands in the editor. */
    html.native-chrome, html.native-chrome body { height: auto; overflow: visible; }
    html.native-chrome #app { height: auto; }
    html.native-chrome #editor-wrapper { overflow: visible; }
    html.native-chrome #editor-tiptap .tiptap { min-height: var(--viewport-h, 0px); }
    /* Nothing may widen the page: with no scrolling box around it, a flex item grows to its
       widest content (a wide table) and pushes the comments pane off screen. Wide tables
       scroll inside their own box instead. */
    html.native-chrome #editor-pane { min-width: 0; overflow-x: clip; overflow-y: visible; }
    html.native-chrome .tiptap .tableWrapper { overflow-x: auto; }

    /* ── The text ── */

    #editor-wrapper {
      flex: 1;
      display: flex;
      align-items: flex-start;
      overflow-y: auto;
      position: relative;
    }

    /* Tiptap renders the content editable inside the element we pass it */
    #editor-tiptap {
      flex: 1;
      min-width: 0;
    }

    #editor-tiptap .tiptap {
      padding: 4.5rem 1rem 2rem 2rem;
      min-height: 100%;
      outline: none;
      font-size: 13px;
      line-height: 1.75;
      color: var(--text);
    }

    /* ── Frontmatter box ── */

    #frontmatter-box {
      max-width: var(--content-width);
      margin: 4.5rem auto 0;
      padding: 0.6rem 1rem;
      background: var(--bg-raised);
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.5;
    }
    #frontmatter-box table { border-collapse: collapse; width: 100%; }
    #frontmatter-box td { padding: 0.15em 0; vertical-align: top; }
    #frontmatter-box td:first-child {
      width: 1%;
      white-space: nowrap;
      padding-right: 1.5rem;
      color: var(--text-3);
    }
    #frontmatter-box td:last-child { color: var(--text); word-break: break-word; }
    #editor-tiptap.has-frontmatter .tiptap { padding-top: 1.5rem; }

    /* ── Tiptap content styles ── */

    /* Centered reading column; tables and diagrams may grow up to the full editor width */
    #editor-tiptap .tiptap > * {
      max-width: var(--content-width);
      margin-left: auto;
      margin-right: auto;
    }
    #editor-tiptap .tiptap > .tableWrapper,
    #editor-tiptap .tiptap > .diagram-block {
      max-width: 100%;
    }
    /* Shrink-to-fit: text width at minimum, growing up to the editor width */
    #editor-tiptap .tiptap > .tableWrapper {
      width: fit-content;
      min-width: min(100%, var(--content-width));
    }

    .tiptap h1, .tiptap h2, .tiptap h3,
    .tiptap h4, .tiptap h5, .tiptap h6 {
      margin: 1.4em 0 0.4em;
      color: var(--text-strong);
      line-height: 1.3;
      font-weight: 500;
    }
    .tiptap h1 { font-size: 1.9em; }
    .tiptap h2 { font-size: 1.5em; }
    .tiptap h3 { font-size: 1.2em; }

    .tiptap p { margin: 0.6em 0; }

    .tiptap strong { color: var(--text-strong); }

    .tiptap code {
      background: var(--bg-surface);
      padding: 0.1em 0.35em;
      border-radius: 3px;
      font-size: 0.875em;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .tiptap pre {
      background: var(--bg-surface);
      padding: 1em;
      border-radius: 6px;
      overflow-x: auto;
      margin: 1em 0;
    }
    .tiptap pre code { background: none; padding: 0; }

    /* Syntax highlighting — light theme */
    .tiptap pre .hljs-keyword,
    .tiptap pre .hljs-operator,
    .tiptap pre .hljs-selector-tag { color: #cf222e; }
    .tiptap pre .hljs-string,
    .tiptap pre .hljs-regexp { color: #0a3069; }
    .tiptap pre .hljs-number,
    .tiptap pre .hljs-literal { color: #0550ae; }
    .tiptap pre .hljs-built_in,
    .tiptap pre .hljs-type { color: #0550ae; }
    .tiptap pre .hljs-title,
    .tiptap pre .hljs-title.function_,
    .tiptap pre .hljs-title.class_ { color: #8250df; }
    .tiptap pre .hljs-variable,
    .tiptap pre .hljs-template-variable { color: #953800; }
    .tiptap pre .hljs-attr,
    .tiptap pre .hljs-attribute,
    .tiptap pre .hljs-property { color: #0550ae; }
    .tiptap pre .hljs-tag,
    .tiptap pre .hljs-name { color: #116329; }
    .tiptap pre .hljs-comment,
    .tiptap pre .hljs-doctag { color: #6e7781; font-style: italic; }
    .tiptap pre .hljs-meta { color: #6e7781; }
    .tiptap pre .hljs-addition { background: rgba(34,197,94,.12); color: #15803d; }
    .tiptap pre .hljs-deletion { background: rgba(239,68,68,.12); color: #dc2626; }

    /* Syntax highlighting — dark theme */
    @media (prefers-color-scheme: dark) {
      .tiptap pre .hljs-keyword,
      .tiptap pre .hljs-operator,
      .tiptap pre .hljs-selector-tag { color: #ff7b72; }
      .tiptap pre .hljs-string,
      .tiptap pre .hljs-regexp { color: #a5d6ff; }
      .tiptap pre .hljs-number,
      .tiptap pre .hljs-literal { color: #79c0ff; }
      .tiptap pre .hljs-built_in,
      .tiptap pre .hljs-type { color: #79c0ff; }
      .tiptap pre .hljs-title,
      .tiptap pre .hljs-title.function_,
      .tiptap pre .hljs-title.class_ { color: #d2a8ff; }
      .tiptap pre .hljs-variable,
      .tiptap pre .hljs-template-variable { color: #ffa657; }
      .tiptap pre .hljs-attr,
      .tiptap pre .hljs-attribute,
      .tiptap pre .hljs-property { color: #79c0ff; }
      .tiptap pre .hljs-tag,
      .tiptap pre .hljs-name { color: #7ee787; }
      .tiptap pre .hljs-comment,
      .tiptap pre .hljs-doctag { color: #8b949e; font-style: italic; }
      .tiptap pre .hljs-meta { color: #8b949e; }
      .tiptap pre .hljs-addition { background: rgba(34,197,94,.15); color: #56d364; }
      .tiptap pre .hljs-deletion { background: rgba(239,68,68,.15); color: #ff7b72; }
    }

    .tiptap blockquote {
      border-left: 3px solid var(--border-muted);
      padding-left: 1em;
      color: var(--text-2);
      margin: 1em 0;
    }

    .tiptap a { color: var(--text-link); }

    .tiptap ul, .tiptap ol { padding-left: 1.5em; margin: 0.5em 0; }

    .tiptap li { margin: 0.2em 0; }

    .tiptap hr {
      border: none;
      border-top: 1px solid var(--border-mid);
      margin: 1.5em 0;
    }

    .tiptap table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
    }
    .tiptap th, .tiptap td {
      border: 1px solid var(--border-mid);
      padding: 0.4em 0.7em;
      line-height: 1.5;
    }
    .tiptap th > p, .tiptap td > p { margin: 0; }
    .tiptap th { font-weight: 600; text-align: left; }

    /* ── Annotation decorations (inline) ── */

    .ann-delete {
      background: var(--ann-del-bg);
      text-decoration: line-through;
      text-decoration-color: var(--ann-del-bdr);
      color: var(--ann-del-text);
      padding: 1px 3px;
      border-radius: 3px;
    }

    .ann-insert-preview {
      background: var(--ann-ins-bg);
      color: var(--ann-ins-text);
      padding: 1px 3px;
      border-radius: 3px;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }

    div.ann-insert-preview {
      padding: 4px 8px;
    }
    div.ann-insert-preview > :first-child { margin-top: 0; }
    div.ann-insert-preview > :last-child { margin-bottom: 0; }

    .ann-replace-preview {
      background: var(--ann-ins-bg);
      color: var(--ann-ins-text);
      border-left: 3px solid var(--ann-ins-bdr);
      border-radius: 0 4px 4px 0;
      padding: 8px 12px;
      margin: 4px 0 4px -15px;
      cursor: pointer;
    }
    .ann-replace-preview > *:last-child { margin-bottom: 0; }

    .ann-highlight,
    .ann-comment-target {
      background: var(--ann-com-bg);
      padding: 1px 3px;
      border-radius: 3px;
    }

    .ann-comment-pending {
      background: var(--ann-com-bg);
      padding: 1px 3px;
      border-radius: 3px;
    }

    /* The preview editor's selection, the same purple as the source editor's. */
    #editor-tiptap .tiptap ::selection { background: var(--cm-selection); }

    /* Inline elements inside annotation decorations inherit the decoration color.
       Needs .tiptap parent to beat .tiptap strong/a/blockquote (specificity 0,1,1). */
    .tiptap .ann-insert-preview *, .tiptap .ann-replace-preview *,
    .tiptap .ann-delete *, .tiptap .ann-comment-target *, .tiptap .ann-highlight * { color: inherit; }

    /* ── Table UI ── */

    /* Column handle — thin tab above hovered column */
    #table-col-handle {
      position: absolute;
      z-index: 20;
      height: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-mid);
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      color: var(--text-4);
      font-size: 9px;
      letter-spacing: 3px;
    }
    #table-col-handle[hidden] { display: none; }
    #table-col-handle::after { content: '•••'; }
    #table-col-handle:hover {
      background: var(--bg-raised);
      border-color: var(--border-muted);
      color: var(--text-2);
    }

    /* Row handle — thin tab left of hovered row */
    #table-row-handle {
      position: absolute;
      z-index: 20;
      width: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-mid);
      border-right: none;
      border-radius: 4px 0 0 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      color: var(--text-4);
      font-size: 9px;
      writing-mode: vertical-lr;
      letter-spacing: 3px;
    }
    #table-row-handle[hidden] { display: none; }
    #table-row-handle::after { content: '•••'; }
    #table-row-handle:hover {
      background: var(--bg-raised);
      border-color: var(--border-muted);
      color: var(--text-2);
    }

    /* Column / row dropdown menus */
    #table-col-menu,
    #table-row-menu {
      position: absolute;
      z-index: 30;
      background: var(--float-bg);
      border: 1px solid var(--border-mid);
      border-radius: 7px;
      box-shadow: var(--float-shadow);
      min-width: 170px;
      padding: 4px;
      display: flex;
      flex-direction: column;
    }
    #table-col-menu[hidden],
    #table-row-menu[hidden] { display: none; }

    #table-col-menu button,
    #table-row-menu button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 6px 10px;
      border: none;
      background: transparent;
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
      color: var(--af-text);
      cursor: pointer;
    }
    #table-col-menu button:hover,
    #table-row-menu button:hover { background: var(--af-hover); }
    #table-col-menu button:disabled,
    #table-row-menu button:disabled { opacity: 0.35; cursor: not-allowed; }
    #table-col-menu button:disabled:hover,
    #table-row-menu button:disabled:hover { background: transparent; }
    #table-col-menu button.tt-menu-danger,
    #table-row-menu button.tt-menu-danger { color: var(--ann-del-text); }
    #table-col-menu button.tt-menu-danger:hover,
    #table-row-menu button.tt-menu-danger:hover { background: var(--ann-del-bg); }

    .tt-menu-sep {
      height: 1px;
      background: var(--border);
      margin: 4px 2px;
      flex-shrink: 0;
    }

    /* Extend "+" buttons */
    #table-extend-row,
    #table-extend-col {
      position: absolute;
      z-index: 15;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid var(--border-mid);
      background: var(--bg-raised);
      color: var(--text-3);
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      pointer-events: auto;
    }
    #table-extend-row[hidden],
    #table-extend-col[hidden] { display: none; }
    #table-extend-row:hover,
    #table-extend-col:hover {
      background: var(--bg-surface);
      color: var(--text);
      border-color: var(--border-muted);
    }

    /* ── Diagram blocks ── */

    .tiptap .diagram-block {
      margin: 1em 0;
      text-align: center;
    }

    .tiptap .diagram-block svg {
      max-width: 100%;
      height: auto;
    }

    .tiptap .diagram-block img {
      max-width: 100%;
      height: auto;
    }

    .tiptap .diagram-loading {
      color: var(--text-4);
      font-style: italic;
      font-size: 13px;
      padding: 1em 0;
    }
    /* The text an accepted suggestion put in, for a moment */
    ::highlight(folio-flash) { background-color: var(--ann-ins-bg); }
  </style>
</head>
<body>
  <div id="app">
    <div id="editor-pane">
      <div id="editor-toolbar">
        <div class="float-pill" id="title-pill">
          <span id="preview-readonly-notice" hidden>Read-only preview</span>
        </div>
      </div>
      <div id="editor-wrapper">
        <div id="editor-tiptap"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
