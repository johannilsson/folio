<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Folio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
    }

    #app {
      display: flex;
      height: 100vh;
    }

    /* ── Editor pane ── */

    #editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #editor-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: #222;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }

    #filename-display {
      flex: 1;
      text-align: center;
      font-size: 13px;
      color: #888;
      font-family: 'SF Mono', 'Fira Code', monospace;
      pointer-events: none;
    }

    #toggle-raw {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: #666;
      cursor: pointer;
      font-family: inherit;
    }
    #toggle-raw:hover { background: rgba(255,255,255,0.07); color: #aaa; }

    /* ── WYSIWYG area: editor + gutter side by side, scrolling together ── */

    #editor-wrapper {
      flex: 1;
      display: flex;
      align-items: flex-start;
      overflow-y: auto;
      position: relative;
    }
    #editor-wrapper[hidden] { display: none; }

    /* Tiptap renders the content editable inside the element we pass it */
    #editor-tiptap {
      flex: 1;
      min-width: 0;
    }

    #editor-tiptap .tiptap {
      padding: 2rem;
      min-height: 100%;
      outline: none;
      font-size: 15px;
      line-height: 1.75;
      color: #e0e0e0;
    }

    /* ── Tiptap content styles ── */

    .tiptap h1, .tiptap h2, .tiptap h3,
    .tiptap h4, .tiptap h5, .tiptap h6 {
      margin: 1.4em 0 0.4em;
      color: #f0f0f0;
      line-height: 1.3;
    }
    .tiptap h1 { font-size: 1.9em; }
    .tiptap h2 { font-size: 1.5em; }
    .tiptap h3 { font-size: 1.2em; }

    .tiptap p { margin: 0.6em 0; }

    .tiptap strong { color: #f0f0f0; }

    .tiptap code {
      background: #2a2a3a;
      padding: 0.1em 0.35em;
      border-radius: 3px;
      font-size: 0.875em;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .tiptap pre {
      background: #2a2a3a;
      padding: 1em;
      border-radius: 6px;
      overflow-x: auto;
      margin: 1em 0;
    }
    .tiptap pre code { background: none; padding: 0; }

    .tiptap blockquote {
      border-left: 3px solid #555;
      padding-left: 1em;
      color: #aaa;
      margin: 1em 0;
    }

    .tiptap a { color: #7dd3fc; }

    .tiptap ul, .tiptap ol { padding-left: 1.5em; margin: 0.5em 0; }

    .tiptap li { margin: 0.2em 0; }

    .tiptap hr {
      border: none;
      border-top: 1px solid #444;
      margin: 1.5em 0;
    }

    .tiptap table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
    }
    .tiptap th, .tiptap td {
      border: 1px solid #444;
      padding: 0.4em 0.7em;
    }
    .tiptap th { background: #2a2a3a; }

    /* ── Raw markdown pane ── */

    #raw-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #raw-pane[hidden] { display: none; }

    #raw-pane textarea {
      flex: 1;
      padding: 2rem;
      background: #1a1a1a;
      color: #cdd6f4;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 13px;
      line-height: 1.6;
      border: none;
      outline: none;
      resize: none;
    }

    /* ── Annotation decorations (inline) ── */

    .ann-delete {
      background: rgba(239, 68, 68, 0.22);
      text-decoration: line-through;
      text-decoration-color: rgba(239, 68, 68, 0.7);
      color: #fca5a5;
      border-bottom: 2px solid rgba(239, 68, 68, 0.55);
      padding-bottom: 1px;
    }

    .ann-insert-preview {
      background: rgba(34, 197, 94, 0.2);
      color: #86efac;
      border-radius: 2px 2px 0 0;
      padding: 0 2px 1px;
      border-bottom: 2px solid rgba(34, 197, 94, 0.55);
    }

    .ann-highlight { background: rgba(245, 158, 11, 0.35); }

    .ann-comment-target {
      background: rgba(250, 204, 21, 0.15);
      border-bottom: 2px solid rgba(250, 204, 21, 0.6);
      padding-bottom: 1px;
    }

    /* ── Annotation gutter (scrolls with document) ── */

    #annotation-gutter {
      width: 280px;
      flex-shrink: 0;
      position: relative;
      pointer-events: none;
    }

    /* ── Gutter cards ── */

    .ann-card {
      position: absolute;
      left: 8px;
      right: 8px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 7px;
      padding: 8px 10px;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ann-card[data-source="agent"]  { border-left: 3px solid #22c55e; }
    .ann-card[data-source="local"]  { border-left: 3px solid #3b82f6; }
    .ann-card[data-source="github"],
    .ann-card[data-source="gitlab"] { border-left: 3px solid #f59e0b; }

    .ann-card-info { display: flex; flex-direction: column; gap: 2px; }

    .ann-card-summary {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      color: #d0d0e0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ann-card-meta {
      font-size: 10px;
      color: #666;
    }

    .ann-card-actions {
      display: none;
      gap: 5px;
    }
    .ann-card-expanded .ann-card-actions { display: flex; }

    .ann-card-btn {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .ann-card-dismiss {
      background: #3a3a50;
      color: #aaa;
    }
    .ann-card-dismiss:hover { background: #44445e; color: #ccc; }

    .ann-card--comment { cursor: pointer; }

    .ann-card-summary::after { content: ' ›'; opacity: 0.4; }
    .ann-card-expanded .ann-card-summary::after { content: ' ⌄'; opacity: 0.5; }

    .ann-card-comment-body {
      display: none;
      font-size: 12px;
      color: #b8b8d0;
      line-height: 1.55;
      margin-top: 5px;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .ann-card-expanded .ann-card-comment-body { display: block; }

    /* ── Overlays (action + comment pill) ── */

    #action-floater, #comment-floater {
      position: absolute;
      z-index: 20;
      display: flex;
      align-items: center;
      padding: 3px 4px;
      background: #1a1a1a;
      border-radius: 999px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.75), 0 1px 4px rgba(0,0,0,0.5);
      transform: translateX(-50%) translateY(calc(-100% - 8px));
      white-space: nowrap;
    }
    #action-floater[hidden] { display: none; }
    #comment-floater[hidden] { display: none; }

    .af-btn {
      font-size: 13px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 999px;
      border: none;
      background: transparent;
      cursor: pointer;
      white-space: nowrap;
      letter-spacing: 0.01em;
    }
    .af-btn { color: #e0e0e0; }
    .af-btn:hover { background: rgba(255,255,255,0.1); }

    .af-divider {
      width: 1px;
      height: 16px;
      background: #333;
      flex-shrink: 0;
    }

    /* ── Floating comment adder ── */

    .cf-gutter-form {
      position: absolute;
      left: 8px;
      right: 8px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-left: 3px solid #3b82f6;
      border-radius: 7px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: auto;
    }
    .cf-gutter-form[hidden] { display: none; }

    .cf-textarea {
      background: #151525;
      border: 1px solid #333;
      border-radius: 4px;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.5;
      padding: 6px 8px;
      resize: none;
      outline: none;
      width: 100%;
    }
    .cf-textarea:focus { border-color: rgba(99, 102, 241, 0.5); }

    .cf-actions { display: flex; gap: 5px; justify-content: flex-end; }

    .cf-submit {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      background: #4f46e5;
      color: #fff;
      font-family: inherit;
    }
    .cf-submit:hover { background: #4338ca; }

    .cf-cancel {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #333;
      background: transparent;
      color: #888;
      cursor: pointer;
      font-family: inherit;
    }
    .cf-cancel:hover { background: #2a2a3a; }

    .ann-card-focused {
      background: rgba(250, 204, 21, 0.05);
      border-color: rgba(250, 204, 21, 0.45);
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="editor-pane">
      <div id="editor-toolbar">
        <button id="toggle-raw">Markdown →</button>
        <span id="filename-display"></span>
      </div>
      <div id="editor-wrapper">
        <div id="editor-tiptap"></div>
      </div>
      <div id="raw-pane" hidden>
        <textarea spellcheck="false" placeholder="Markdown source…"></textarea>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
