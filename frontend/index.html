<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Folio</title>
  <style>
    /* ── Theme variables ── */

    :root {
      --bg: #1a1a1a;
      --accent: #a78bfa;
      --card-tint: #222;
      --accent-soft: rgba(124, 58, 237, 0.16);
      --bg-raised: #222;
      --bg-surface: #2a2a3a;
      --bg-input: #151525;
      --border: #333;
      --border-mid: #444;
      --border-muted: #555;
      --text: #e0e0e0;
      --text-strong: #f0f0f0;
      --text-2: #aaa;
      --text-3: #888;
      --text-4: #666;
      --text-link: #7dd3fc;
      --text-raw: #cdd6f4;
      --card-bg: #1a1a1a;
      --card-author: #d0d0e0;
      --card-body: #b8b8d0;
      --card-focused: rgba(255,255,255,.4);
      --chip-bg: #3a3a50;
      --chip-bg-h: #44445e;
      --chip: #aaa;
      --chip-h: #ccc;
      --float-bg: #1a1a1a;
      --float-shadow: 0 4px 20px rgba(0,0,0,.75), 0 1px 4px rgba(0,0,0,.5);
      --af-text: #e0e0e0;
      --af-hover: rgba(255,255,255,.1);
      --af-div: #333;
      --cancel-bg-h: #2a2a3a;
      --toolbar-btn-hover: rgba(255,255,255,.07);
      --toolbar-btn-hover-text: #aaa;
      --ann-del-bg: rgba(239,68,68,.22);
      --ann-del-text: #fca5a5;
      --ann-del-bdr: rgba(239,68,68,.55);
      --ann-ins-bg: rgba(34,197,94,.2);
      --ann-ins-text: #86efac;
      --ann-ins-bdr: rgba(34,197,94,.55);
      --ann-hi: rgb(247,253,73);
      --ann-com-bg: rgba(250,204,21,.28);
      --ann-com-bdr: rgba(250,204,21,.9);
      --cm-selection: rgba(125,211,252,.25);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --accent: #7c3aed;
        --card-tint: #f7f7f5;
        --accent-soft: rgba(124, 58, 237, 0.08);
        --bg-raised: #f0f0ee;
        --bg-surface: #ebebf0;
        --bg-input: #f0f0f5;
        --border: #d8d8d5;
        --border-mid: #ddd;
        --border-muted: #bbb;
        --text: #1a1a1a;
        --text-strong: #0f0f0f;
        --text-2: #666;
        --text-3: #777;
        --text-4: #999;
        --text-link: #2563eb;
        --text-raw: #1e1e3a;
        --card-bg: #ffffff;
        --card-author: #2a2a3a;
        --card-body: #444460;
        --card-focused: rgba(0,0,0,.3);
        --chip-bg: #e8e8f0;
        --chip-bg-h: #d8d8e8;
        --chip: #666;
        --chip-h: #444;
        --float-bg: #ffffff;
        --float-shadow: 0 4px 20px rgba(0,0,0,.15), 0 1px 4px rgba(0,0,0,.08);
        --af-text: #1a1a1a;
        --af-hover: rgba(0,0,0,.07);
        --af-div: #ddd;
        --cancel-bg-h: #ebebf0;
        --toolbar-btn-hover: rgba(0,0,0,.06);
        --toolbar-btn-hover-text: #555;
        --ann-del-bg: rgba(239,68,68,.12);
        --ann-del-text: #dc2626;
        --ann-del-bdr: rgba(239,68,68,.5);
        --ann-ins-bg: rgba(34,197,94,.12);
        --ann-ins-text: #15803d;
        --ann-ins-bdr: rgba(34,197,94,.5);
        --ann-hi: rgb(202,138,4);
        --ann-com-bg: rgba(250,204,21,.18);
        --ann-com-bdr: rgba(250,204,21,.7);
        --cm-selection: rgba(37,99,235,.18);
      }
    }

    /* ── Base ── */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    #app {
      display: flex;
      height: 100vh;
    }

    /* ── Editor pane ── */

    #editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Floating controls: pills overlay the text, which flows edge to edge */
    #editor-pane { position: relative; }

    #editor-toolbar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      pointer-events: none;
    }
    #editor-toolbar > * { pointer-events: auto; }

    .float-pill {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 30px;
      padding: 0 12px;
      background: var(--bg-raised);
      border-radius: 15px;
    }
    .float-pill-group { display: flex; gap: 8px; }
    .float-pill, .float-pill-btn { box-sizing: border-box; }
    .float-pill-btn { width: 30px; padding: 0; justify-content: center; }
    .float-pill-btn .float-btn { width: 100%; height: 100%; border-radius: 50%; padding: 0; line-height: 0; }
    .float-btn svg { width: 13px; height: 13px; display: block; }

    #filename-display {
      font-size: 12px;
      font-weight: 400;
      color: var(--text);
      pointer-events: none;
    }

    #preview-readonly-notice {
      font-size: 12px;
      color: var(--text-3);
      cursor: help;
    }
    #preview-readonly-notice[hidden] { display: none; }

    .float-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 12px;
      background: transparent;
      color: var(--text-2);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
    }
    .float-btn:hover { background: var(--toolbar-btn-hover); color: var(--toolbar-btn-hover-text); }
    .float-btn.active { background: transparent; color: var(--chip); }
    .float-pill-btn:has(.float-btn.active) { background: var(--chip-bg); }

    /* ── WYSIWYG area: editor + gutter side by side, scrolling together ── */

    #editor-wrapper {
      flex: 1;
      display: flex;
      align-items: flex-start;
      overflow-y: auto;
      position: relative;
    }
    #editor-wrapper[hidden] { display: none; }

    /* Tiptap renders the content editable inside the element we pass it */
    #editor-tiptap {
      flex: 1;
      min-width: 0;
    }

    #editor-tiptap .tiptap {
      padding: 4.5rem 2rem 2rem 2rem;
      min-height: 100%;
      outline: none;
      font-size: 13px;
      line-height: 1.75;
      color: var(--text);
    }

    /* ── Tiptap content styles ── */

    .tiptap h1, .tiptap h2, .tiptap h3,
    .tiptap h4, .tiptap h5, .tiptap h6 {
      margin: 1.4em 0 0.4em;
      color: var(--text-strong);
      line-height: 1.3;
      font-weight: 500;
    }
    .tiptap h1 { font-size: 1.9em; }
    .tiptap h2 { font-size: 1.5em; }
    .tiptap h3 { font-size: 1.2em; }

    .tiptap p { margin: 0.6em 0; }

    .tiptap strong { color: var(--text-strong); }

    .tiptap code {
      background: var(--bg-surface);
      padding: 0.1em 0.35em;
      border-radius: 3px;
      font-size: 0.875em;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .tiptap pre {
      background: var(--bg-surface);
      padding: 1em;
      border-radius: 6px;
      overflow-x: auto;
      margin: 1em 0;
    }
    .tiptap pre code { background: none; padding: 0; }

    /* Syntax highlighting — light theme */
    .tiptap pre .hljs-keyword,
    .tiptap pre .hljs-operator,
    .tiptap pre .hljs-selector-tag { color: #cf222e; }
    .tiptap pre .hljs-string,
    .tiptap pre .hljs-regexp { color: #0a3069; }
    .tiptap pre .hljs-number,
    .tiptap pre .hljs-literal { color: #0550ae; }
    .tiptap pre .hljs-built_in,
    .tiptap pre .hljs-type { color: #0550ae; }
    .tiptap pre .hljs-title,
    .tiptap pre .hljs-title.function_,
    .tiptap pre .hljs-title.class_ { color: #8250df; }
    .tiptap pre .hljs-variable,
    .tiptap pre .hljs-template-variable { color: #953800; }
    .tiptap pre .hljs-attr,
    .tiptap pre .hljs-attribute,
    .tiptap pre .hljs-property { color: #0550ae; }
    .tiptap pre .hljs-tag,
    .tiptap pre .hljs-name { color: #116329; }
    .tiptap pre .hljs-comment,
    .tiptap pre .hljs-doctag { color: #6e7781; font-style: italic; }
    .tiptap pre .hljs-meta { color: #6e7781; }
    .tiptap pre .hljs-addition { background: rgba(34,197,94,.12); color: #15803d; }
    .tiptap pre .hljs-deletion { background: rgba(239,68,68,.12); color: #dc2626; }

    /* Syntax highlighting — dark theme */
    @media (prefers-color-scheme: dark) {
      .tiptap pre .hljs-keyword,
      .tiptap pre .hljs-operator,
      .tiptap pre .hljs-selector-tag { color: #ff7b72; }
      .tiptap pre .hljs-string,
      .tiptap pre .hljs-regexp { color: #a5d6ff; }
      .tiptap pre .hljs-number,
      .tiptap pre .hljs-literal { color: #79c0ff; }
      .tiptap pre .hljs-built_in,
      .tiptap pre .hljs-type { color: #79c0ff; }
      .tiptap pre .hljs-title,
      .tiptap pre .hljs-title.function_,
      .tiptap pre .hljs-title.class_ { color: #d2a8ff; }
      .tiptap pre .hljs-variable,
      .tiptap pre .hljs-template-variable { color: #ffa657; }
      .tiptap pre .hljs-attr,
      .tiptap pre .hljs-attribute,
      .tiptap pre .hljs-property { color: #79c0ff; }
      .tiptap pre .hljs-tag,
      .tiptap pre .hljs-name { color: #7ee787; }
      .tiptap pre .hljs-comment,
      .tiptap pre .hljs-doctag { color: #8b949e; font-style: italic; }
      .tiptap pre .hljs-meta { color: #8b949e; }
      .tiptap pre .hljs-addition { background: rgba(34,197,94,.15); color: #56d364; }
      .tiptap pre .hljs-deletion { background: rgba(239,68,68,.15); color: #ff7b72; }
    }

    .tiptap blockquote {
      border-left: 3px solid var(--border-muted);
      padding-left: 1em;
      color: var(--text-2);
      margin: 1em 0;
    }

    .tiptap a { color: var(--text-link); }

    .tiptap ul, .tiptap ol { padding-left: 1.5em; margin: 0.5em 0; }

    .tiptap li { margin: 0.2em 0; }

    .tiptap hr {
      border: none;
      border-top: 1px solid var(--border-mid);
      margin: 1.5em 0;
    }

    .tiptap table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
    }
    .tiptap th, .tiptap td {
      border: 1px solid var(--border-mid);
      padding: 0.4em 0.7em;
    }
    .tiptap th { background: var(--accent-soft); }

    /* ── Raw markdown pane ── */

    #raw-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #raw-pane[hidden] { display: none; }

    /* Editor + gutter side by side, scrolling together — mirrors #editor-wrapper */
    #raw-editor-wrapper {
      flex: 1;
      display: flex;
      align-items: flex-start;
      overflow-y: auto;
      position: relative;
    }

    #raw-editor-mount {
      flex: 1;
      min-width: 0;
      padding-top: 3.5rem;
    }

    #raw-pane .cm-editor {
      outline: none;
      background: var(--bg);
    }
    #raw-pane .cm-scroller {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px;
      line-height: 1.6;
    }
    /* No `background` here deliberately: .cm-content is a flex sibling of
       .cm-selectionLayer/.cm-cursorLayer (not their parent), and CM6 relies
       on .cm-content staying transparent so those layers, rendered behind
       it, show through. An opaque background here paints over the selection
       highlight entirely — that's what was making it invisible. The editor
       background lives on #raw-pane .cm-editor above instead. */
    #raw-pane .cm-content {
      padding: 2rem 1.5rem 2rem 0;
      color: var(--text-raw);
      /* .cm-content is a flex item of .cm-scroller (flex-grow: 2, flex-shrink: 0
         by CM6's own base theme). Without this, an unwrapped (white-space: pre)
         table row's intrinsic width becomes .cm-content's automatic min-width,
         overflowing past the sibling line-number gutter into the annotation
         gutter instead of scrolling just that row. */
      min-width: 0;
    }
    /* Halves CM6's default 6px left inset on each line — combined with the
       gutter's own 3px right padding, this is the numbers-to-content gap. */
    #raw-pane .cm-line {
      padding-left: 3px;
    }
    /* Wide table rows would otherwise wrap character-by-character like
       prose, scrambling columns — keep each row on one line and scroll it
       horizontally instead. Class applied by raw-table-layout.ts. */
    #raw-pane .cm-line.cm-table-row {
      white-space: pre;
      overflow-x: auto;
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* legacy Edge */
    }
    #raw-pane .cm-line.cm-table-row::-webkit-scrollbar {
      display: none; /* Chrome/Safari */
    }
    #raw-pane .cm-gutters {
      background: var(--bg);
      border: none;
      color: var(--border-mid);
    }
    /* CM6's default (0 3px 0 5px) also pads each line-number element itself,
       independent of the gutter container's own padding — the actual
       remaining source of left-edge space once the container's is zeroed. */
    #raw-pane .cm-lineNumbers .cm-gutterElement {
      padding-left: 0;
    }

    /* CM6's built-in selection color is hardcoded for a light background
       (#d9d9d9/#d7d4f0) since it's never told our app is dark by default —
       nearly invisible against --bg here. Override with a themed color that
       works in both modes, beating CM6's rule via the #raw-pane id selector. */
    #raw-pane .cm-selectionBackground,
    #raw-pane .cm-focused .cm-selectionBackground {
      background: var(--cm-selection) !important;
    }

    /* ── Annotation decorations (inline) ── */

    .ann-delete {
      background: var(--ann-del-bg);
      text-decoration: line-through;
      text-decoration-color: var(--ann-del-bdr);
      color: var(--ann-del-text);
      border-bottom: 2px solid var(--ann-del-bdr);
      padding: 1px 3px;
      border-radius: 3px;
    }

    .ann-insert-preview {
      background: var(--ann-ins-bg);
      color: var(--ann-ins-text);
      border-bottom: 2px solid var(--ann-ins-bdr);
      padding: 1px 3px;
      border-radius: 3px;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }

    div.ann-insert-preview {
      padding: 4px 8px;
    }
    div.ann-insert-preview > :first-child { margin-top: 0; }
    div.ann-insert-preview > :last-child { margin-bottom: 0; }

    .ann-replace-preview {
      background: var(--ann-ins-bg);
      color: var(--ann-ins-text);
      border-left: 3px solid var(--ann-ins-bdr);
      border-radius: 0 4px 4px 0;
      padding: 8px 12px;
      margin: 4px 0 4px -15px;
      cursor: pointer;
    }
    .ann-replace-preview > *:last-child { margin-bottom: 0; }

    .ann-highlight {
      text-decoration: underline dotted var(--ann-hi);
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
      padding: 1px 3px;
      border-radius: 3px;
    }

    .ann-comment-target {
      background: var(--ann-com-bg);
      border-bottom: 2px solid var(--ann-com-bdr);
      padding: 1px 3px;
      border-radius: 3px;
    }

    .ann-comment-pending {
      background: var(--ann-com-bg);
      border-bottom: 2px dashed var(--ann-com-bdr);
      padding: 1px 3px;
      border-radius: 3px;
    }

    /* Inline elements inside annotation decorations inherit the decoration color.
       Needs .tiptap parent to beat .tiptap strong/a/blockquote (specificity 0,1,1). */
    .tiptap .ann-insert-preview *, .tiptap .ann-replace-preview *,
    .tiptap .ann-delete *, .tiptap .ann-comment-target *, .tiptap .ann-highlight * { color: inherit; }

    /* Same, for the CM6 raw pane — .ann-insert-preview/.ann-replace-preview
       reused as-is there (see below), so they need the same override. */
    #raw-pane .ann-insert-preview *, #raw-pane .ann-replace-preview * { color: inherit; }

    /* ── CM6 raw-pane annotation decorations (read-only) ──
       No `padding` here (unlike the .ann-* classes above): padding on an
       arbitrary sub-line range can shift character alignment/line-wrapping
       in CM6's monospace line-rendering model, which prose spans don't hit. */

    .cm-ann-delete {
      background: var(--ann-del-bg);
      text-decoration: line-through;
      text-decoration-color: var(--ann-del-bdr);
      color: var(--ann-del-text);
      border-bottom: 2px solid var(--ann-del-bdr);
      border-radius: 3px;
    }

    .cm-ann-highlight {
      text-decoration: underline dotted var(--ann-hi);
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
      border-radius: 3px;
    }

    .cm-ann-comment-target {
      background: var(--ann-com-bg);
      border-bottom: 2px solid var(--ann-com-bdr);
      border-radius: 3px;
    }

    /* ── Annotation gutter (scrolls with document) ── */

    #annotation-gutter, #raw-annotation-gutter {
      width: 280px;
      flex-shrink: 0;
      position: relative;
      pointer-events: none;
      margin-right: 2rem;
    }
    #app:not(.gutter-open) #annotation-gutter,
    #app:not(.gutter-open) #raw-annotation-gutter { display: none; }

    /* ── Gutter cards ── */

    .ann-card {
      position: absolute;
      left: 1rem;
      right: 8px;
      background: var(--card-tint);
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 12px;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ann-card-unanchored { opacity: 0.65; }
    .ann-card-lost-badge {
      font-size: 10px;
      color: var(--text-3);
      font-style: italic;
    }

    .ann-card-actions {
      display: none;
      flex-direction: column;
      gap: 6px;
    }
    .ann-card-focused .ann-card-actions { display: flex; }

    .ann-card-action-row {
      display: flex;
      gap: 5px;
    }

    .ann-card-btn {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .ann-card { cursor: pointer; }

    .ann-card-dismiss {
      background: var(--chip-bg);
      color: var(--chip);
    }
    .ann-card-dismiss:hover { background: var(--chip-bg-h); color: var(--chip-h); }

    .ann-card-header {
      display: flex;
      align-items: baseline;
      gap: 6px;
      position: relative;
    }
    .ann-card-header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .ann-card-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--text-3);
      font-size: 14px;
      line-height: 1;
      width: 22px;
      height: 22px;
      border-radius: 5px;
      cursor: pointer;
      font-family: inherit;
    }
    .ann-card-icon-btn:hover { background: var(--af-hover); color: var(--af-text); }
    .ann-card-menu {
      position: absolute;
      top: 100%;
      right: 0;
      z-index: 30;
      background: var(--float-bg);
      border: 1px solid var(--border-mid);
      border-radius: 7px;
      box-shadow: var(--float-shadow);
      min-width: 130px;
      padding: 4px;
      display: flex;
      flex-direction: column;
    }
    .ann-card-menu[hidden] { display: none; }
    .ann-card-menu-item {
      border: none;
      background: transparent;
      color: var(--af-text);
      text-align: left;
      font-size: 12px;
      padding: 5px 8px;
      border-radius: 5px;
      cursor: pointer;
      font-family: inherit;
    }
    .ann-card-menu-item:hover { background: var(--af-hover); }
    .ann-card-menu-danger { color: var(--ann-del-text); }
    .ann-card-menu-danger:hover { background: var(--ann-del-bg); }
    .ann-edit { display: flex; flex-direction: column; gap: 6px; }
    .ann-card-author {
      font-size: 13px;
      font-weight: 500;
      color: var(--card-author);
    }
    .ann-card-time {
      font-size: 11px;
      color: var(--text-3);
    }

    .ann-card-body {
      font-size: 12px;
      color: var(--card-body);
      line-height: 1.55;
      word-break: break-word;
    }

    .ann-card-comment {
      font-size: 12px;
      font-style: italic;
      color: var(--text-3);
      line-height: 1.55;
      word-break: break-word;
      border-top: 1px solid var(--border);
      padding-top: 5px;
    }

    /* ── Markdown inside card text fields ── */

    :is(.ann-card-body, .ann-card-comment, .ann-reply-body) > p { margin: 0; }
    :is(.ann-card-body, .ann-card-comment, .ann-reply-body) > p + p { margin-top: 0.4em; }
    :is(.ann-card-body, .ann-card-comment, .ann-reply-body) :is(ul, ol) { margin: 0.2em 0; padding-left: 1.4em; }
    :is(.ann-card-body, .ann-card-comment, .ann-reply-body) li + li { margin-top: 0.15em; }
    :is(.ann-card-body, .ann-card-comment, .ann-reply-body) code {
      font-family: ui-monospace, monospace;
      font-size: 0.9em;
      background: var(--code-bg, rgba(0,0,0,0.07));
      padding: 0 3px;
      border-radius: 3px;
    }

    /* ── Reply thread ── */

    .ann-thread { display: flex; flex-direction: column; }

    .ann-entry {
      position: relative;
      display: flex;
      gap: 10px;
      padding-bottom: 12px;
    }
    .ann-entry:not(:last-child)::after {
      content: '';
      position: absolute;
      left: 13px;
      top: 34px;
      bottom: 4px;
      width: 1px;
      background: var(--border-mid);
    }
    .ann-card:not(.ann-card-focused) .ann-entry:last-child { padding-bottom: 0; }

    /* Connect the last entry to the reply field's avatar while it is shown */
    .ann-card-focused .ann-entry:last-child::after {
      content: '';
      position: absolute;
      left: 13px;
      top: 34px;
      bottom: -6px;
      width: 1px;
      background: var(--border-mid);
    }
    .ann-entry-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }

    .ann-avatar {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 500;
      color: #fff;
    }

    .ann-reply-header {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .ann-reply-author {
      font-size: 13px;
      font-weight: 500;
      color: var(--card-author);
    }

    .ann-reply-time {
      font-size: 11px;
      color: var(--text-3);
    }

    .ann-reply-body {
      font-size: 12px;
      color: var(--card-body);
      line-height: 1.55;
      word-break: break-word;
    }

    .ann-card-reply {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-3);
      font-weight: 500;
    }
    .ann-card-reply:hover { background: var(--cancel-bg-h); color: var(--text-2); }

    .ann-reply-textarea {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      line-height: 1.5;
      padding: 5px 7px;
      resize: none;
      outline: none;
      width: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }
    .ann-reply-textarea:focus { border-color: var(--border-muted); }

    .ann-reply-box {
      flex-direction: row;
      align-items: flex-start;
      gap: 10px;
    }
    .ann-reply-box > .ann-avatar { margin-top: 4px; }
    .ann-reply-field {
      position: relative;
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
    }
    .ann-reply-box .ann-reply-textarea {
      background: transparent;
      border-color: var(--border-mid);
      border-radius: 18px;
      padding: 8px 40px 8px 14px;
      min-height: 36px;
    }
    .ann-send-btn {
      position: absolute;
      right: 5px;
      bottom: 5px;
      width: 26px;
      height: 26px;
      padding: 0;
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--border-mid);
      color: var(--text-3);
      cursor: pointer;
    }
    .ann-send-btn svg { width: 13px; height: 13px; }
    .ann-send-btn.ready { background: var(--text-2); color: var(--bg); }

    /* ── Overlays (action + comment pill) ── */

    #action-floater, #comment-floater {
      position: absolute;
      z-index: 20;
      display: flex;
      align-items: center;
      padding: 3px 4px;
      background: var(--float-bg);
      border-radius: 999px;
      box-shadow: var(--float-shadow);
      transform: translateX(-50%) translateY(calc(-100% - 8px));
      white-space: nowrap;
    }
    #action-floater[hidden] { display: none; }
    #comment-floater[hidden] { display: none; }

    .af-btn {
      font-size: 13px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 999px;
      border: none;
      background: transparent;
      cursor: pointer;
      white-space: nowrap;
      letter-spacing: 0.01em;
    }
    .af-btn { color: var(--af-text); }
    .af-btn:hover { background: var(--af-hover); }

    .af-divider {
      width: 1px;
      height: 16px;
      background: var(--af-div);
      flex-shrink: 0;
    }

    /* ── Floating comment adder ── */

    .cf-gutter-form {
      position: absolute;
      left: 1rem;
      right: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: auto;
    }
    .cf-gutter-form[hidden] { display: none; }

    .cf-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--card-author);
    }

    .cf-cancel {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: var(--text-3);
      cursor: pointer;
      font-family: inherit;
    }
    .cf-cancel:hover { color: var(--text-2); }

    .ann-card-focused {
      border-color: var(--card-focused);
    }

    /* ── Table UI ── */

    /* Column handle — thin tab above hovered column */
    #table-col-handle {
      position: absolute;
      z-index: 20;
      height: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-mid);
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      color: var(--text-4);
      font-size: 9px;
      letter-spacing: 3px;
    }
    #table-col-handle[hidden] { display: none; }
    #table-col-handle::after { content: '•••'; }
    #table-col-handle:hover {
      background: var(--bg-raised);
      border-color: var(--border-muted);
      color: var(--text-2);
    }

    /* Row handle — thin tab left of hovered row */
    #table-row-handle {
      position: absolute;
      z-index: 20;
      width: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-mid);
      border-right: none;
      border-radius: 4px 0 0 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      color: var(--text-4);
      font-size: 9px;
      writing-mode: vertical-lr;
      letter-spacing: 3px;
    }
    #table-row-handle[hidden] { display: none; }
    #table-row-handle::after { content: '•••'; }
    #table-row-handle:hover {
      background: var(--bg-raised);
      border-color: var(--border-muted);
      color: var(--text-2);
    }

    /* Column / row dropdown menus */
    #table-col-menu,
    #table-row-menu {
      position: absolute;
      z-index: 30;
      background: var(--float-bg);
      border: 1px solid var(--border-mid);
      border-radius: 7px;
      box-shadow: var(--float-shadow);
      min-width: 170px;
      padding: 4px;
      display: flex;
      flex-direction: column;
    }
    #table-col-menu[hidden],
    #table-row-menu[hidden] { display: none; }

    #table-col-menu button,
    #table-row-menu button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 6px 10px;
      border: none;
      background: transparent;
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
      color: var(--af-text);
      cursor: pointer;
    }
    #table-col-menu button:hover,
    #table-row-menu button:hover { background: var(--af-hover); }
    #table-col-menu button:disabled,
    #table-row-menu button:disabled { opacity: 0.35; cursor: not-allowed; }
    #table-col-menu button:disabled:hover,
    #table-row-menu button:disabled:hover { background: transparent; }
    #table-col-menu button.tt-menu-danger,
    #table-row-menu button.tt-menu-danger { color: var(--ann-del-text); }
    #table-col-menu button.tt-menu-danger:hover,
    #table-row-menu button.tt-menu-danger:hover { background: var(--ann-del-bg); }

    .tt-menu-sep {
      height: 1px;
      background: var(--border);
      margin: 4px 2px;
      flex-shrink: 0;
    }

    /* Extend "+" buttons */
    #table-extend-row,
    #table-extend-col {
      position: absolute;
      z-index: 15;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid var(--border-mid);
      background: var(--bg-raised);
      color: var(--text-3);
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      pointer-events: auto;
    }
    #table-extend-row[hidden],
    #table-extend-col[hidden] { display: none; }
    #table-extend-row:hover,
    #table-extend-col:hover {
      background: var(--bg-surface);
      color: var(--text);
      border-color: var(--border-muted);
    }

    /* ── Diagram blocks ── */

    .tiptap .diagram-block {
      margin: 1em 0;
      text-align: center;
    }

    .tiptap .diagram-block svg {
      max-width: 100%;
      height: auto;
    }

    .tiptap .diagram-block img {
      max-width: 100%;
      height: auto;
    }

    .tiptap .diagram-loading {
      color: var(--text-4);
      font-style: italic;
      font-size: 13px;
      padding: 1em 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="editor-pane">
      <div id="editor-toolbar">
        <div class="float-pill" id="title-pill">
          <span id="filename-display"></span>
          <span id="preview-readonly-notice" hidden>Read-only preview</span>
        </div>
        <div class="float-pill-group">
          <div class="float-pill float-pill-btn">
            <button id="view-toggle-btn" class="float-btn" title="Markdown source" aria-label="Toggle markdown source" aria-pressed="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 4.5 2 8l3.5 3.5M10.5 4.5 14 8l-3.5 3.5"/></svg></button>
          </div>
          <div class="float-pill float-pill-btn">
            <button id="toggle-gutter-btn" class="float-btn" title="Comments" aria-label="Toggle comments" aria-pressed="false">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3.5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1H6.5L3.5 13.5V11h0a1 1 0 0 1-1-1z"/><path d="M5.5 5.5h5M5.5 8h3"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div id="editor-wrapper" hidden>
        <div id="editor-tiptap"></div>
      </div>
      <div id="raw-pane"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
