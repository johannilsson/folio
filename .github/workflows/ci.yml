name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # Duplicate copies of a package (e.g. prosemirror-model) break the frontend type check.
      - name: Check lockfile has no duplicates
        working-directory: frontend
        run: pnpm dedupe --check

      # Frontend build, cargo build/test and unit tests; the macOS app steps only run on macOS.
      - name: Verify
        run: ./scripts/verify.sh

      # The pictures tour only runs with FOLIO_SNAPSHOT set, as it does locally, so it is a separate
      # run that does not gate the job; it is there to be looked at.
      - name: Self-test pictures
        if: always() && runner.os == 'macOS'
        continue-on-error: true
        env:
          FOLIO_SNAPSHOT: ${{ runner.temp }}/snapshots/folio
        run: |
          mkdir -p "$RUNNER_TEMP/snapshots"
          macos/.build/debug/Folio --self-test macos/selftest.md

      - name: Upload self-test pictures
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: selftest-pictures
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore
