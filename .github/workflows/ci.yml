name: CI

on:
  pull_request:
    # `labeled` so adding the `pictures` label takes the pictures without a new push.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

jobs:
  verify:
    # Adding some other label must not rerun CI.
    if: github.event.action != 'labeled' || github.event.label.name == 'pictures'
    # Write access is for the pictures branch and comment, see scripts/ci-pictures.sh.
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # Duplicate copies of a package (e.g. prosemirror-model) break the frontend type check.
      - name: Check lockfile has no duplicates
        working-directory: frontend
        run: pnpm dedupe --check

      # Frontend build, cargo build/test and unit tests; the macOS app steps only run on macOS.
      - name: Verify
        run: ./scripts/verify.sh

      # The pictures are only taken for a pull request with the `pictures` label, for changes that
      # touch what the app looks like. The tour only runs with FOLIO_SNAPSHOT set, as it does locally,
      # so it is a separate run that does not gate the job; it is there to be looked at.
      - name: Self-test pictures
        if: >-
          always() && runner.os == 'macOS'
          && contains(github.event.pull_request.labels.*.name, 'pictures')
        continue-on-error: true
        env:
          FOLIO_SNAPSHOT: ${{ runner.temp }}/snapshots/folio
        run: |
          mkdir -p "$RUNNER_TEMP/snapshots"
          macos/.build/debug/Folio --self-test macos/selftest.md

      # The web preview's pictures, in a step of their own so a failure above does not skip them.
      - name: Web preview pictures
        if: >-
          always() && runner.os == 'macOS'
          && contains(github.event.pull_request.labels.*.name, 'pictures')
        continue-on-error: true
        env:
          FOLIO_SNAPSHOT: ${{ runner.temp }}/snapshots/web
        run: macos/.build/debug/Folio -WebPreview YES --self-test macos/selftest.md

      # Only for a pull request from this repository: forks and Dependabot get a read-only token.
      - name: Show the pictures on the pull request
        if: >-
          always() && runner.os == 'macOS' && github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'pictures')
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci-pictures.sh

      - name: Upload self-test pictures
        if: >-
          always() && runner.os == 'macOS'
          && contains(github.event.pull_request.labels.*.name, 'pictures')
        uses: actions/upload-artifact@v7
        with:
          name: selftest-pictures
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore

  # A single check named `test`, which branch protection can require whatever the matrix holds.
  # `always()` matters: a skipped job counts as passing, so this must run and fail on its own.
  test:
    needs: verify
    if: always() && (github.event.action != 'labeled' || github.event.label.name == 'pictures')
    runs-on: ubuntu-24.04
    steps:
      - name: Every verify job passed
        run: test "${{ needs.verify.result }}" = success
