[package]
name = "folio"
version = "0.1.0"
edition = "2021"

[lib]
name = "folio"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "folio"
path = "src/main.rs"

[dependencies]
serde        = { version = "1",   features = ["derive"] }
serde_json   = { version = "1", features = ["preserve_order"] }
clap         = { version = "4",   features = ["derive"] }
anyhow       = "1"
toml_edit    = "0.22"
