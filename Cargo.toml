[package]
name = "folio"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "folio"
path = "src/main.rs"

[dependencies]
axum         = { version = "0.8", features = ["ws"] }
tokio        = { version = "1",   features = ["full"] }
tower-http   = { version = "0.6", features = ["cors"] }
notify       = "6"
serde        = { version = "1",   features = ["derive"] }
serde_json   = "1"
rust-embed   = "8"
clap         = { version = "4",   features = ["derive"] }
mime_guess   = "2"
open         = "5"
anyhow       = "1"
